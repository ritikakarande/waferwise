[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waferwise"
version = "0.1.0"
description = "Wafer-map defect classification: label audit, synthetic rare defects, and INT8 deployment on Intel CPUs."
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
