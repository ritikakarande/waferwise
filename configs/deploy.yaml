# Deployment of the final model: ONNX -> OpenVINO FP32 -> INT8 (NNCF) -> confidence gate.
run: outputs/oversampled_seed1      # chosen on validation on Day 5 (see README)
out_dir: outputs/deploy
seed: 42

quantization:
  samples_per_class: 100            # calibration wafers from the TRAIN split, balanced so rare patterns are covered

gate:
  target_auto_accuracy: 0.995       # accuracy required on the wafers the model decides alone
