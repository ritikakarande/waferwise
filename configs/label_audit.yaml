# Label audit on the TRAINING split only (val and test labels are never changed).
experiment_name: label_audit
data_config: configs/data.yaml
seed: 42
folds: 5

# Out-of-fold CNN predictions produced by scripts/cross_val.py
cnn_members:
  cnn_a: outputs/audit_cnn_a
  cnn_b: outputs/audit_cnn_b

# Gradient-boosted trees on hand-made features (a different kind of model, for diversity)
trees:
  max_iter: 200
  learning_rate: 0.1
  max_leaf_nodes: 31

suspects_csv: audit/suspect_labels.csv   # committed: defines the cleaned training set
