# The final recipe (configs/oversampled.yaml) trained on the lot-grouped split, to check performance on unseen lots.
experiment_name: lot_oversampled
data_config: configs/data_lot.yaml
seed: 42

model:
  channels: [16, 32, 64, 128]
  dropout: 0.3

train:
  epochs: 30
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  class_weighting: inverse_sqrt   # none | inverse | inverse_sqrt
  augment: true                   # random flips and 90-degree rotations
  early_stopping_patience: 30     # longer than the run: val macro-F1 is too noisy at high LR to stop early
  num_workers: 0
  oversample:
    classes: [Near-full, Donut, Random]
    extra_per_class: 2000
