name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e .
      - name: Show the CPU and what OpenVINO can use on it
        run: python -c "import openvino as ov; c = ov.Core(); print(c.get_property('CPU', 'FULL_DEVICE_NAME'), c.get_property('CPU', 'OPTIMIZATION_CAPABILITIES'))"
      # Tests that need the 2 GB dataset skip themselves; everything else runs.
      - name: Tests
        run: pytest -q
      - name: Demo on the committed model and wafers
        run: python scripts/demo.py

  cpp:
    name: C++ build and Python parity (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install OpenCV and a compiler
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential libopencv-dev
      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt -e .
      - name: Build the CLI against the OpenVINO runtime from the Python wheel
        run: |
          cmake -S cpp -B cpp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DOpenVINO_DIR="$(python -c 'from openvino.utils import get_cmake_path; print(get_cmake_path())')"
          cmake --build cpp/build
      - name: C++ gives the same answers as Python
        run: pytest -q tests/test_demo.py
        env:
          WAFERWISE_INFER: cpp/build/waferwise_infer
